# OneKiwi RZ/V2H SOM kernel options that are not enabled by the arm64 defconfig.
# Same board options as the OneKiwi SDK v5.20 kernel defconfig.

# I2C buses implemented with GPIOs: i2c4_csi3, i2c5_hdmi (ADV7535), i2c6_csi0 (camera), i2c7_soft
CONFIG_I2C_GPIO=y

# Audio codecs (DTS: sgtl5000 or es8388, selected by CODEC_SGTLT5000)
CONFIG_SND_SOC_SGTL5000=y
CONFIG_SND_SOC_ES8328=y
CONFIG_SND_SOC_ES8328_I2C=y

# Wi-Fi: Broadcom SDIO module (DTS: brcm,bcm4329-fmac / bcm43430-fmac, AP6212)
CONFIG_WLAN=y
CONFIG_BRCMUTIL=y
CONFIG_BRCMFMAC=y
CONFIG_BRCMFMAC_SDIO=y

# Bluetooth: Broadcom UART (DTS: brcm,bcm43438-bt / bcm43430a1-bt)
CONFIG_BT=y
CONFIG_BT_HCIUART=y
CONFIG_BT_HCIUART_SERDEV=y
CONFIG_BT_HCIUART_BCM=y
CONFIG_SERIAL_DEV_CTRL_TTYPORT=y

# USB network / Wi-Fi adapters (as in OneKiwi SDK v5.20)
CONFIG_USB_NET_DRIVERS=y
CONFIG_USB_USBNET=y
CONFIG_USB_RTL8152=y
CONFIG_USB_NET_AX8817X=y
CONFIG_WLAN_VENDOR_REALTEK=y
CONFIG_RTL8XXXU=m
CONFIG_RTL8XXXU_UNTESTED=y
