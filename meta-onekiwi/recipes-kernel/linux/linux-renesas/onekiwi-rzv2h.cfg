# OneKiwi RZ/V2H SOM kernel options not enabled by the arm64 defconfig
# (same as the board options in the previous OneKiwi SDK 6.0 udl.cfg)

# I2C buses implemented with GPIOs: i2c4_csi3, i2c5_hdmi (ADV7535), i2c6_csi0 (camera), i2c7_soft
CONFIG_I2C_GPIO=y

# RZ/V2H USB PHY control reset driver
CONFIG_RESET_RZV2H_USBPHY_CTRL=y
