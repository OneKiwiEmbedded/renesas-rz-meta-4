CONFIG_USB_XHCI_RZV2H=y
CONFIG_USB_VIDEO_CLASS=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=m
CONFIG_SND_HWDEP=m
CONFIG_SND_RAWMIDI=m
CONFIG_RESET_RZV2H_USBPHY_CTRL=y
CONFIG_VIDEO_IMX415=y
CONFIG_VIDEO_RENESAS_RZG2L_CRU=y
CONFIG_VIDEO_RENESAS_RZG2L_CSI2=y


# Show the boot log and a login console on HDMI (Ubuntu minimal has no desktop)
CONFIG_FRAMEBUFFER_CONSOLE=y
